[tool.poetry]
name = "relay-builder-backend"
version = "0.1.0"
description = "Backend utilities for building swim relay teams from Excel data."
authors = ["Gil Kiesler <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.2.0"
openpyxl = "^3.1.0"
python-dotenv = "^1.0.0"
fastapi = "^0.109.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }

[tool.poetry.group.dev.dependencies]
ipython = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

