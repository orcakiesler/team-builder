<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Team Builder – Login</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.5rem;
    }
    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 2rem 2.25rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    .login-card h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .login-card p {
      margin: 0;
      margin-bottom: 1.25rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .login-actions {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: flex-end;
    }
    .login-error {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #f85149;
      min-height: 1.2em;
    }
    .login-footer {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
    .optional {
      font-weight: normal;
      color: var(--text-muted);
      font-size: 0.85em;
    }
    .login-card .form-group input {
      width: 100%;
      min-width: 0;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .login-card .form-group input:focus,
    .login-card .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .login-card .form-group select {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .login-toggle {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .login-toggle a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
    }
    .login-toggle a:hover {
      text-decoration: underline;
    }
    .login-view.hidden,
    .signup-view.hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Relay Team Builder</h1>

      <div id="login-view" class="login-view">
        <p>Sign in to manage meets, swimmers, and relay teams.</p>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="text" id="login-email" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required />
          </div>
          <div class="login-actions">
            <button type="submit" class="btn btn-primary" id="login-submit">Log in</button>
          </div>
          <div class="login-error" id="login-error"></div>
        </form>
        <p class="login-toggle">Don’t have an account? <a id="show-signup" href="#">Create account</a></p>
      </div>

      <div id="signup-view" class="signup-view hidden">
        <p>Create an account to use Relay Team Builder.</p>
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="text" id="signup-email" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="signup-role">I am a</label>
            <select id="signup-role">
              <option value="coach">Coach</option>
              <option value="swimmer">Swimmer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="signup-invite-code">Invite code <span class="optional">(if your coach gave you one)</span></label>
            <input type="text" id="signup-invite-code" autocomplete="off" placeholder="e.g. ABC123" maxlength="12" />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" autocomplete="new-password" required minlength="6" />
          </div>
          <div class="form-group">
            <label for="signup-password-confirm">Confirm password</label>
            <input type="password" id="signup-password-confirm" autocomplete="new-password" required minlength="6" />
          </div>
          <div class="login-actions">
            <button type="submit" class="btn btn-primary" id="signup-submit">Create account</button>
          </div>
          <div class="login-error" id="signup-error"></div>
        </form>
        <p class="login-toggle">Already have an account? <a id="show-login" href="#">Sign in</a></p>
      </div>

      <div class="login-footer">
        Auth server: <span id="login-auth-url"></span>
      </div>
    </div>
  </div>
  <script src="auth-config.js"></script>
  <script src="renderer/login.js"></script>
</body>
</html>
